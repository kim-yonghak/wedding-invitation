name: Publish wedding invitation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wedding-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Set absolute preview-image URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/prepare-pages.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
